name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No dependency cache for releases: the published XPI is always built from a clean npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check -- "$RELEASE_TAG"
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: npm run check
      - name: Release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > dist/release-notes.md
      # updates.json must ship with every release: the plugin's update_url reads it from the latest release.
      - name: Publish XPI, checksum and update manifest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Glossa for Zotero ${{ github.ref_name }}
          body_path: dist/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/glossa-zotero-${{ github.ref_name }}.xpi
            dist/glossa-zotero-${{ github.ref_name }}.xpi.sha256
            dist/updates.json
